x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: ./Dockerfile.airflow
  env_file:
    - ${_ENV_FILE_PATH}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__XCOM_BACKEND: airflow.models.xcom.BaseXCom
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__TEST_CONNECTION: 'Enabled'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'

    # ═══════════════════════════════════════════════════════════
    # 🔥 ИСПРАВЛЕННЫЕ ПАРАМЕТРЫ ПАРАЛЛЕЛИЗМА
    # ═══════════════════════════════════════════════════════════
    # Реальный потолок = 5 воркеров × 4 задачи = 20 параллельных задач
    AIRFLOW__CORE__PARALLELISM: 32                          # было 144 → 32 (с запасом, без излишков)
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 15              # было 4 → 15 (чтобы не резать max_active_runs=10 в DAG)
    AIRFLOW__CORE__DAGRUN_CONF_ENABLED: 'true'

    # ═══════════════════════════════════════════════════════════
    # 🔥 ИСПРАВЛЕННЫЙ CELERY — равномерная раздача по воркерам
    # ═══════════════════════════════════════════════════════════
    AIRFLOW__CELERY__WORKER_CONCURRENCY: 4                  # было 12 → 4 (1 Creyt + 2-3 лёгких задачи на воркер)
    AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: 1          # не копить задачи локально
    AIRFLOW__CELERY__WORKER_MAX_TASKS_PER_CHILD: 0          # было 50 → 0 (без перезапуска форков — стабильнее для долгих задач)

    # ═══════════════════════════════════════════════════════════
    # 🔥 УБРАНЫ ТАЙМАУТЫ — задачи работают сколько нужно
    # ═══════════════════════════════════════════════════════════
    # AIRFLOW__CORE__TASK_EXECUTION_TIMEOUT: 14400          # ❌ УБРАНО — был глобальный kill через 4 часа
    AIRFLOW__CORE__TASK_ADHOC_TIMEOUT: 0                    # без таймаута для ad-hoc задач

    # ═══════════════════════════════════════════════════════════
    # 🔥 ZOMBIE DETECTION — мягче, чтобы не убивать долгие задачи
    # ═══════════════════════════════════════════════════════════
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    AIRFLOW__SCHEDULER__MAX_THREADS: 8
    AIRFLOW__CORE__TASK_INSTANCE_HEARTBEAT_TIMEOUT: 1800    # было 600 (10 мин) → 1800 (30 мин)
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT_DETECTION_INTERVAL: 120  # было 60 → 120
    AIRFLOW__SCHEDULER__ZOMBIE_DETECTION_INTERVAL: 300      # проверка zombie раз в 5 мин (вместо 1 мин)
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 'false'

    # === DATA_STORAGE Configuration (без изменений) ===
    DATA_STORAGE_CATALOG_NAME: ml_sandbox
    DATA_STORAGE_WAREHOUSE: s3://${DATA_STORAGE_S3_BUCKET}/
    DATA_STORAGE_S3_ENDPOINT: ${DATA_STORAGE_S3_ENDPOINT}
    DATA_STORAGE_S3_REGION: ${DATA_STORAGE_S3_REGION}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    S3_PATH_STYLE_ACCESS: "true"
    PYARROW_S3_ENDPOINT_OVERRIDE: ${DATA_STORAGE_S3_ENDPOINT}
    PYARROW_S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
    PYARROW_S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    PYARROW_S3_REGION: ${DATA_STORAGE_S3_REGION:-us-east-1}
    PYARROW_S3_PATH_STYLE: "true"
    PYARROW_S3_SCHEME: "http"
    PYARROW_S3_ALLOW_BUCKET_LOOKUP: "false"
    PYICEBERG_IO__IMPL: pyiceberg.io.pyarrow.PyArrowFileIO

  volumes:
    - type: bind
      source: ./airflow/dags
      target: /opt/airflow/dags
    - type: bind
      source: ./airflow/logs
      target: /opt/airflow/logs
    - type: bind
      source: ./airflow/plugins
      target: /opt/airflow/plugins
    - type: bind
      source: ./airflow/config
      target: /opt/airflow/config
    - type: bind
      source: ./airflow/scripts
      target: /opt/airflow/scripts
  user: "${AIRFLOW_UID:-50000}:0"
  # extra_hosts:
  #   - "ml-cluster-raw-layer:135.106.148.140"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres_airflow:
      condition: service_healthy
  networks:
    - ml_sandbox_network

services:
  postgres_airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: ${_POSTGRES_USER_AIRFLOW}
      POSTGRES_PASSWORD: ${_POSTGRES_PASSWORD_AIRFLOW}
      POSTGRES_DB: ${_POSTGRES_DB_AIRFLOW}
    volumes:
      - type: volume
        source: pg_airflow_db_volume
        target: /var/lib/postgresql/data
        volume:
          nocopy: false
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.10
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:latest
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.11
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  airflow-webserver:
    <<: *airflow-common
    entrypoint: bash
    command: ["/opt/airflow/scripts/webserver.sh"]
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.20
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  airflow-scheduler:
    <<: *airflow-common
    entrypoint: bash
    command: ["/opt/airflow/scripts/scheduler.sh"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.21
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 3G

  airflow-triggerer:
    <<: *airflow-common
    entrypoint: bash
    command: ["/opt/airflow/scripts/triggerer.sh"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.23
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  airflow-worker-1: &airflow-worker
    <<: *airflow-common
    command: celery worker
    deploy:
      resources:
        limits:
          cpus: '7'
          memory: 50G
        reservations:
          cpus: '1.5'
          memory: 8G
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: 0
      MALLOC_ARENA_MAX: 2
      PYTHONMALLOC: malloc
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery -A airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker-2:
    <<: *airflow-worker

  # airflow-worker-3:
  #   <<: *airflow-worker

  # airflow-worker-4:
  #   <<: *airflow-worker

  # airflow-worker-5:
  #   <<: *airflow-worker

  airflow-init:
    <<: *airflow-common
    entrypoint: ["/entrypoint"]
    command: >
      bash -c "
        set -e &&
        echo '🔄 Airflow init...' &&
        airflow db migrate &&
        echo '✅ DB ready' &&
        if ! airflow users list 2>/dev/null | grep -q '$${_AIRFLOW_WWW_USER_USERNAME:-admin}'; then
          airflow users create \
            --username '$${_AIRFLOW_WWW_USER_USERNAME:-admin}' \
            --firstname 'Admin' \
            --lastname 'User' \
            --role 'Admin' \
            --email 'admin@example.com' \
            --password '$${_AIRFLOW_WWW_USER_PASSWORD:-admin}'
          echo '👤 User created'
        else
          echo '⚠️ User already exists'
        fi &&
        echo '✅ Init complete' &&
        exit 0
      "
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    depends_on:
      <<: *airflow-common-depends-on
      minio-init:
        condition: service_completed_successfully
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.24
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command: ["/opt/airflow/scripts/cli.sh"]
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.25
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  flower:
    <<: *airflow-common
    command: ["/opt/airflow/scripts/flower.sh"]
    profiles:
      - flower
    ports:
      - 5555:5555
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.26
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    volumes:
      - type: volume
        source: hadoop_namenode_volume
        target: /hadoop/dfs/name
        volume:
          nocopy: false
      - type: bind
        source: ./hadoop/config/core-site.xml
        target: /opt/hadoop-3.2.1/etc/hadoop/core-site.xml
      - type: bind
        source: ./hadoop/config/hdfs-site.xml
        target: /opt/hadoop-3.2.1/etc/hadoop/hdfs-site.xml
      - type: bind
        source: ./hadoop/hdfs-init.sh
        target: /hdfs-init.sh
    environment:
      CLUSTER_NAME: ${_HADOOP_CLUSTER_NAME}
      HDFS_CONF_dfs_namenode_rpc_bind_host: "0.0.0.0"
      HDFS_CONF_dfs_namenode_http_bind_host: "0.0.0.0"
      HDFS_CONF_dfs_client_use_datanode_hostname: "false"
      HDFS_CONF_dfs_datanode_use_datanode_hostname: "false"
      HDFS_CONF_dfs_namenode_datanode_registration_ip_hostname_check: "false"
      HDFS_CONF_dfs_permissions_enabled: "false"
    env_file:
      - .env
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.30
    ports:
      - "9870:9870"
      - "8020:8020"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest-catalog
    ports:
      - "8181:8181"
    environment:
      - CATALOG_NAME=default
      - CATALOG_WAREHOUSE=s3://iceberg-warehouse
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - s3.endpoint=http://minio:9000
      - aws.s3.endpoint=http://minio:9000
      - s3.bucket.endpoint=http://minio:9000
      - CATALOG_S3_PATH_STYLE_ACCESS=true
      - AWS_S3_PATH_STYLE_ACCESS=true
      - s3.path-style-access=true
      - path.style.access=true
      - aws.s3.path.style.access=true
      - s3.access-style=path
      - CATALOG_S3_CHECKSUM_ENABLED=false
      - client.region=us-east-1
      - QUARKUS_LOG_LEVEL=DEBUG
      - QUARKUS_LOG_CATEGORY__ORG_APACHE_ICEBERG__LEVEL=DEBUG
      - QUARKUS_LOG_CATEGORY__SOFTWARE_AMAZON__LEVEL=DEBUG
    extra_hosts:
      - "minio:172.21.0.81"
      - "ml-sandbox-minio-1:172.21.0.81"
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.90
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/q/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  hadoop-datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    volumes:
      - type: volume
        source: hadoop_datanode_volume
        target: /hadoop/dfs/data
        volume:
          nocopy: false
      - type: bind
        source: ./hadoop/config/core-site.xml
        target: /opt/hadoop-3.2.1/etc/hadoop/core-site.xml
      - type: bind
        source: ./hadoop/config/hdfs-site.xml
        target: /opt/hadoop-3.2.1/etc/hadoop/hdfs-site.xml
    env_file:
      - .env
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.31
    ports:
      - "9864:9864"
      - "9865:9865"
    depends_on:
      - hadoop-namenode
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  nifi:
    build:
      context: ./nifi
      dockerfile: ./Dockerfile.nifi
    container_name: nifi
    entrypoint:
      - bash
      - -c
      - |
        echo "→ Копирование пользовательских NAR-библиотек в lib..." &&
        cp -rn /opt/nifi/nar_libs/. /opt/nifi/nifi-current/lib/ 2>/dev/null || true &&
        echo "→ Готово. Добавлено $$(ls -1 /opt/nifi/nar_libs/ 2>/dev/null | wc -l) файлов." &&
        exec /opt/nifi/scripts/start.sh
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      NIFI_WEB_HTTP_PORT: ${_NIFI_WEB_HTTP_PORT}
      NIFI_WEB_HTTP_HOST: ${_NIFI_WEB_HTTP_HOST}
      NIFI_WEB_HTTPS_PORT: ${_NIFI_WEB_HTTPS_PORT}
      NIFI_WEB_HTTPS_HOST: ${_NIFI_WEB_HTTPS_HOST}
      NIFI_SENSITIVE_PROPS_KEY: ${_NIFI_SENSITIVE_PROPS_KEY}
      NIFI_SECURITY_USER_AUTHORIZER: ${_NIFI_SECURITY_USER_AUTHORIZER}
      NIFI_SECURITY_USER_LOGIN_IDENTITY_PROVIDER: ${_NIFI_SECURITY_USER_LOGIN_IDENTITY_PROVIDER}
    env_file:
      - .env
    volumes:
      - type: volume
        source: nifi_flow_volume
        target: /opt/nifi/nifi-current/flowfile_repository
      - type: volume
        source: nifi_content_volume
        target: /opt/nifi/nifi-current/content_repository
      - type: volume
        source: nifi_provenance_volume
        target: /opt/nifi/nifi-current/provenance_repository
      - type: volume
        source: nifi_db_volume
        target: /opt/nifi/nifi-current/database_repository
      - type: volume
        source: nifi_conf_volume
        target: /opt/nifi/nifi-current/conf
      - type: bind
        source: ./nifi/conf/login-identity-providers.xml
        target: /opt/nifi/nifi-current/conf/login-identity-providers.xml
      - type: bind
        source: ./nifi/nar_libs/
        target: /opt/nifi/nar_libs
      - type: bind
        source: ./nifi/init_scripts/copy_nar_libs.sh
        target: /opt/nifi/scripts/copy_nar_libs.sh
      - type: bind
        source: ./nifi/execute_scripts
        target: /opt/nifi/execute_scripts
      - type: bind
        source: ./hadoop/config
        target: /opt/nifi/hadoop_conf
      - type: bind
        source: ./nifi/test_data
        target: /opt/nifi/test_data
    restart: unless-stopped
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.40
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  cloudberry:
    build:
      context: ./cloudberry
      dockerfile: ./Dockerfile.cloudberry
    hostname: cdw
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      - CLOUDBERRY_DWH_DB
      - CLOUDBERRY_DWH_USER
      - CLOUDBERRY_DWH_PASSWORD
    volumes:
      - type: volume
        source: cloudberry_data_volume
        target: /home/gpadmin/cloudberry/gpAux/gpdemo
        volume:
          nocopy: false
    restart: unless-stopped
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.50
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  zookeeper:
    image: zookeeper:3.9.3
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.60
    environment:
      ALLOW_ANONYMOUS_LOGIN: ${_ALLOW_ANONYMOUS_LOGIN}
      ZOOKEEPER_CLIENT_PORT: ${_ZOOKEEPER_CLIENT_PORT}
      TZ: ${_TZ}
    ports:
      - "2182:2181"
      - "2888:2888"
      - "3888:3888"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ==========================================
  # ЕДИНЫЙ ИНСТАНС CLICKHOUSE (БЕЗ РЕПЛИКАЦИИ)
  # ==========================================
  clickhouse:
    image: yandex/clickhouse-server:latest
    container_name: clickhouse-server
    hostname: clickhouse
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.70
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - type: bind
        source: ./clickhouse/configs/default_user.xml
        target: /etc/clickhouse-server/users.d/default_user.xml
      - type: bind
        source: ./clickhouse/configs/z_config.xml
        target: /etc/clickhouse-server/config.d/z_config.xml
      - type: volume
        source: clickhouse_data_volume
        target: /var/lib/clickhouse
        volume:
          nocopy: false
    ports:
      - "8123:8123"  # HTTP интерфейс (Web UI, REST)
      - "9000:9000"  # Native интерфейс (клиенты, драйверы)
    deploy:
      resources:
        limits:
          cpus: '4.0'       # Увеличил лимит, так как теперь он один
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  postgres_ml_flow:
    image: postgres:17
    environment:
      POSTGRES_USER: ${_POSTGRES_USER_MLFLOW}
      POSTGRES_PASSWORD: ${_POSTGRES_PASSWORD_MLFLOW}
      POSTGRES_DB: ${_POSTGRES_DB_MLFLOW}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - type: bind
        source: ./mlflow/postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${_POSTGRES_USER_MLFLOW:-mlflow} -d ${_POSTGRES_DB_MLFLOW:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.80
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo '⏳ Waiting for MinIO...' &&
        sleep 5 &&
        mc alias set myminio http://minio:9000 ${_MINIO_ROOT_USER} ${_MINIO_ROOT_PASSWORD} &&
        mc mb -p myminio/${MLFLOW_S3_BUCKET} 2>/dev/null || echo '⚠️ Bucket ${MLFLOW_S3_BUCKET} exists' &&
        mc mb -p myminio/${DATA_STORAGE_S3_BUCKET} 2>/dev/null || echo '⚠️ Bucket ${DATA_STORAGE_S3_BUCKET} exists' &&
        echo '✅ Buckets ready: [${MLFLOW_S3_BUCKET}, ${DATA_STORAGE_S3_BUCKET}]'
      "
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.87
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  minio:
    image: minio/minio
    ports:
      - "9010:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${_MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - type: bind
        source: ./minio/minio-data
        target: /data
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.81
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  mlflow:
    build:
      context: ./mlflow
      dockerfile: ./Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      POSTGRES_HOST: postgres_ml_flow
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${_POSTGRES_USER_MLFLOW}
      POSTGRES_PASSWORD: ${_POSTGRES_PASSWORD_MLFLOW}
      POSTGRES_DB: ${_POSTGRES_DB_MLFLOW}
      MLFLOW_BACKEND_STORE_URI: ${_MLFLOW_BACKEND_STORE_URI}
      S3_PATH_STYLE_ACCESS: "true" 
    env_file:
      - .env
    command:
      - mlflow
      - server
      - --backend-store-uri
      - ${_MLFLOW_BACKEND_STORE_URI}
      - --default-artifact-root
      - s3://${MLFLOW_S3_BUCKET}/
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    depends_on:
      postgres_ml_flow:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.82
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  label_studio:
    image: heartexlabs/label-studio:latest
    container_name: label_studio
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - type: bind
        source: ./label_studio/data
        target: /label_studio/data
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.83
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  postgres_superset:
    image: postgres:16
    environment:
      POSTGRES_USER: ${_POSTGRES_USER_SUPERSET}
      POSTGRES_PASSWORD: ${_POSTGRES_PASSWORD_SUPERSET}
      POSTGRES_DB: ${_POSTGRES_DB_SUPERSET}
    env_file:
      - .env
    volumes:
      - type: volume
        source: pg_superset_db_volume
        target: /var/lib/postgresql/data
        volume:
          nocopy: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.84
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  superset:
    image: apache/superset:4.0.2
    ports:
      - "8088:8088"
    depends_on:
      postgres_superset:
        condition: service_healthy
    volumes:
      - type: volume
        source: superset_volume
        target: /app/superset_home
      - type: bind
        source: ./superset/config
        target: /app/pythonpath
    environment:
      SUPERSET_SECRET_KEY: ${_SUPERSET_SECRET_KEY}
      SUPERSET_DB_URI: ${_SUPERSET_DB_URI}
      SUPERSET_CONFIG_PATH: ${_SUPERSET_CONFIG_PATH}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.85
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  trino:
    image: trinodb/trino:latest
    container_name: trino-server
    ports:
      - "8085:8080"
    environment:
      JAVA_TOOL_OPTIONS: ${_JAVA_TOOL_OPTIONS}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      ml_sandbox_network:
        ipv4_address: 172.21.0.86
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

volumes:
  pg_airflow_db_volume:
  airflow_logs_volume:
  hadoop_namenode_volume:
  hadoop_datanode_volume:
  cloudberry_data_volume:
  superset_volume:
  pg_superset_db_volume:
  nifi_flow_volume:
  nifi_content_volume:
  nifi_provenance_volume:
  nifi_db_volume:
  nifi_conf_volume:
  clickhouse_data_volume: # <-- Единый том для ClickHouse

networks:
  ml_sandbox_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16